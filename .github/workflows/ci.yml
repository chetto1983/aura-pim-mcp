# The IMAP changes tests need real servers: GreenMail, and Dovecot for CONDSTORE and real passwords.
# They read PIM_TEST_GREENMAIL and PIM_TEST_DOVECOT as host:port. An unset one fails the test here,
# because CI is set, and leaves it inconclusive on a developer's machine. To run them locally, use the
# two `docker run` lines below, then set the variables.
name: CI Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.404 (2026-11-10) never finishes `dotnet test` here: the suite stalls partway and no
          # further test reports, on every subset tried. 10.0.403 runs it in under 30 s, also against
          # the 10.0.15 runtime that ships with 10.0.404, so the stall is in the SDK's test tooling,
          # not the runtime the image uses. Move back to 10.0.x once a newer SDK runs the suite.
          dotnet-version: '10.0.403'

      # setup-dotnet installs next to the runner's own SDKs, and dotnet picks the newest one unless a
      # global.json says otherwise. Written here, not committed, so local builds and the Dockerfile's
      # sdk:10.0 image are not bound to 10.0.403.
      - name: Pin the SDK for this run
        run: dotnet new globaljson --sdk-version 10.0.403 --roll-forward disable --force

      - name: Restore dependencies
        run: dotnet restore calendar-mcp.slnx

      - name: Build solution
        run: dotnet build calendar-mcp.slnx --configuration Release --no-restore

      - name: Start the IMAP test servers
        run: |
          docker run -d --name pim-greenmail -p 3143:3143 greenmail/standalone:2.1.15
          docker run -d --name pim-dovecot -p 31143:31143 -e USER_PASSWORD='{PLAIN}secret' \
            -v "$PWD/src/CalendarMcp.Tests/TestData/Dovecot/test.conf:/etc/dovecot/conf.d/test.conf:ro" \
            dovecot/dovecot:2.4.5
          for port in 3143 31143; do
            timeout 60 bash -c "until (echo > /dev/tcp/localhost/$port) 2>/dev/null; do sleep 1; done"
          done

      - name: Run tests
        env:
          PIM_TEST_GREENMAIL: localhost:3143
          PIM_TEST_DOVECOT: localhost:31143
        run: dotnet test calendar-mcp.slnx --configuration Release --no-build --verbosity normal
