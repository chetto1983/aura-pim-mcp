name: aura-publish-image

# Publishes the Aura PIM sidecar image to GHCR. Uses the Actions GITHUB_TOKEN
# (has packages:write), so no local write:packages PAT is needed.
# Trigger manually (Actions tab → Run workflow) or on changes to the build inputs.

on:
  workflow_dispatch:
  push:
    # main carries the sidecar work. The aura/pim-sidecar branch it once named
    # was an ancestor of main and was deleted on 2026-11-12.
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'Directory.Build.props'
      - '.github/workflows/aura-publish-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ISO week for the apt layer
        id: week
        run: echo "apt_week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APT_WEEK=${{ steps.week.outputs.apt_week }}
          # `latest` is the tag Aura's compose follows, so a merge to main reaches the
          # deployment without anyone editing a digest. The stale-pin problem this
          # workflow's own header describes is what a moving tag exists to solve;
          # `sidecar` stays for anyone already following it.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sidecar
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
