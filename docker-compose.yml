# Calendar MCP HTTP Server - Docker Compose Example
# Usage: docker compose up -d
#
# First-time setup:
#   1. Copy your appsettings.json to ./data/appsettings.json
#   2. Set the OAuth issuer and resource below
#   3. Run: docker compose up -d
#   5. Authenticate accounts via: POST http://localhost:8080/admin/auth/{accountId}/start

services:
  calendar-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - calendar-mcp-data:/app/data
    environment:
      - CALENDAR_MCP_OAuth__Issuer=${CALENDAR_MCP_OAUTH_ISSUER:-https://auth.example}
      - CALENDAR_MCP_OAuth__MetadataAddress=${CALENDAR_MCP_OAUTH_METADATA_ADDRESS:-https://auth.example/.well-known/oauth-authorization-server}
      - CALENDAR_MCP_OAuth__Resource=${CALENDAR_MCP_OAUTH_RESOURCE:-https://calendar.example/}
      # Optional: OpenTelemetry endpoint for observability
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  calendar-mcp-data:
    driver: local
