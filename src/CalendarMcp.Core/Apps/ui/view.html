<!--
  The one MCP Apps view for this server.

  Every read tool whose result it can draw names this one ui:// resource, so the
  view is shared by those tools: it adapts whichever payload family came back into
  one uniform row shape and renders that. The families are the shapes measured against the live sidecar, not guessed
  from the C# models -- events, emails, contacts, accounts, calendars -- and
  anything unrecognised falls through to raw JSON rather than a confident blank.

  Three panes, because the list and the item being read are different questions and
  a client that answers only one of them at a time makes you lose your place.

  It never fetches over the network: the first payload arrives over postMessage,
  and anything further is a tools/call routed back through the host, which is why
  the resource declares every CSP domain list empty. Nothing is ever assigned to
  innerHTML -- a mailbox is exactly the place where someone else writes the strings.
-->
